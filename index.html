        body { 
            font-family: Arial, sans-serif;

        /* MAIN MENU */ 
        .menu { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            flex-wrap: wrap; 
            background-color: #fff09a; 
            padding: 20px; 
            border-radius: 12px; 
        } 
 
        /* MENU ITEMS */ 
        .menu-item { 
            position: relative; 
        } 
 
        .menu a { 
            display: block; 
            background-color: #05036b; 
            color: white; 
            padding: 12px 20px; 
            text-decoration: none; 
            border-radius: 6px; 
            transition: 0.3s ease; 
        } 
 
        /* HOVER EFFECT */ 
        .menu a:hover { 
            background-color: #80b3ff; 
            color: #222; 
            transform: translateY(-5px); 
            box-shadow: 0 0 10px #11217c, 
                        0 0 25px #0ff; 
        } 
 
        /* SUBMENU */ 
        .submenu { 
            display: none; 
            position: absolute; 
            top: 100%; 
            left: 0; 
            min-width: 160px; 
            background-color: #234d9b; 
            padding: 8px; 
            border-radius: 8px; 
            z-index: 10; 
        } 
 
        /* SHOW SUBMENU WHEN HOVERED */ 
        .menu-item:hover .submenu { 
            display: block; 
        } 
 
        /* SUBMENU LINKS */ 
        .submenu a { 
            background-color: #ffb18d; 
            margin: 5px 0; 
            border-radius: 5px; 
        } 
 
        .submenu a:hover { 
            background-color: #f696ff; 
            transform: translateX(5px); 
        } 
 
    </style> 
</head>
